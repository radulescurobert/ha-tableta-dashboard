- title: Rețea
  path: retea
  icon: mdi:lan
  type: panel
  cards:
  - type: custom:tb-net-card
- title: Muzică
  path: muzica
  icon: mdi:music-circle
  type: panel
  cards:
  - type: custom:tb-music-card
- title: F1
  path: f1
  icon: mdi:flag-checkered
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 1
    cards:
    - type: vertical-stack
      cards:
      - type: custom:f1-next-race-card
        card_mod:
          style: ':host { display: block; max-height: calc(50vh - 80px); overflow-y: auto; }'
      - type: custom:f1-weather-card
        card_mod:
          style: ':host { display: block; max-height: calc(50vh - 80px); overflow-y: auto; }'
  - type: grid
    column_span: 1
    cards:
    - type: custom:f1-last-race-results-card
      card_mod:
        style: ':host { display: block; height: calc(100vh - 150px); max-height: calc(100vh - 150px); overflow-y: auto; overflow-x: hidden; }

          ha-card { max-height: none !important; }'
  - type: grid
    column_span: 1
    cards:
    - type: custom:f1-championship-prediction-drivers-card
      card_mod:
        style: ':host { display: block; height: calc(100vh - 150px); max-height: calc(100vh - 150px); overflow-y: auto; overflow-x: hidden; }

          ha-card { max-height: none !important; }'
  - type: grid
    column_span: 1
    cards:
    - type: custom:f1-championship-prediction-teams-card
      card_mod:
        style: ':host { display: block; height: calc(100vh - 150px); max-height: calc(100vh - 150px); overflow-y: auto; overflow-x: hidden; }

          ha-card { max-height: none !important; }'
