# Tablet dashboard — sanitized export. Create a new dashboard (Settings → Dashboards), open Raw configuration editor, paste this.
# Resource needed: /local/tableta/tableta-cards.js?v=39 (type: JavaScript module). HACS: kiosk-mode, card-mod; F1 view needs the f1_sensor integration + its cards (remove the F1 view if unused).
# Replace every YOUR_* entity. Cards not listed with options (acasa, pv, heat, vacuum, air, alarm, net, music) read their entities from defaults() inside www/tableta/tb-*.js.
title: Tablet dashboard
kiosk_mode:
  hide_sidebar: true
  hide_header: false
views:
- title: Acasă
  path: acasa
  icon: mdi:weather-partly-cloudy
  type: panel
  cards:
  - type: custom:tb-acasa-card
- title: Fotovoltaic
  path: fotovoltaic
  icon: mdi:solar-power-variant
  type: panel
  cards:
  - type: custom:tb-pv-card
- title: Căldură
  path: incalzire
  icon: mdi:radiator
  type: panel
  cards:
  - type: custom:tb-heat-card
- title: Senzori
  path: senzori
  icon: mdi:access-point-network
  type: panel
  cards:
  - type: custom:tb-sensors-card
    battery_exclude:
    - _soh
    climate:
    - - Room 1
      - sensor.YOUR_ROOM_1_TEMPERATURE
      - sensor.YOUR_ROOM_1_HUMIDITY
      - sensor.YOUR_ROOM_1_BATTERY
      - mdi:sofa-outline
    - - Room 2
      - sensor.YOUR_ROOM_2_TEMPERATURE
      - sensor.YOUR_ROOM_2_HUMIDITY
      - null
      - mdi:bed-king-outline
    - - Outside
      - sensor.YOUR_OUTDOOR_TEMPERATURE
      - sensor.YOUR_OUTDOOR_HUMIDITY
      - sensor.YOUR_OUTDOOR_BATTERY
      - mdi:tree-outline
- title: Prize & lumini
  path: prize
  icon: mdi:power-socket-eu
  type: panel
  cards:
  - type: custom:tb-power-card
    plugs:
    - name: Plug 1
      icon: mdi:power-socket-eu
      p: sensor.YOUR_PLUG_1_POWER
      e: sensor.YOUR_PLUG_1_ENERGY
      v: sensor.YOUR_PLUG_1_VOLTAGE
      a: sensor.YOUR_PLUG_1_CURRENT
      note: optional note
    - name: Plug 2 (with switch)
      icon: mdi:pump
      p: sensor.YOUR_PLUG_2_POWER
      e: sensor.YOUR_PLUG_2_ENERGY
      eLabel: today
      sw: switch.YOUR_PLUG_2_SWITCH
      spin: true
    - name: Plug 3
      icon: mdi:fan
      p: sensor.YOUR_PLUG_3_POWER
      sw: switch.YOUR_PLUG_3_SWITCH
      spin: true
- title: Aspiratoare
  path: aspiratoare
  icon: mdi:robot-vacuum
  type: panel
  cards:
  - type: custom:tb-vacuum-card
- title: Aer
  path: aer
  icon: mdi:air-purifier
  type: panel
  cards:
  - type: custom:tb-air-card
- title: Alarmă
  path: alarma
  icon: mdi:shield-home
  type: panel
  cards:
  - type: custom:tb-alarm-card
